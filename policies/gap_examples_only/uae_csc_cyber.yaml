  - id: uae.csc-cirp.ncrg-level3-declaration
    title: "UAE cyber incident response plan 2.2: the NCRG Chair is to declare a Level 3 incident when alert-schema thresholds are met"
    text: >-
      If relevant thresholds or incident indicators are met defined by the Cyber Incident Alert
      Schema, based on the recommendation of the NSOC, the NCRG Chair is to declare a
      Significant Cyber Incident – (Level 3).
    source_file: Cyber Incident Response Plan V2.0.pdf
    page: 18
    article: "2.2 National Cyber Response Group (NCRG), Role during Significant Cyber Incidents (Level 3)"
    issuer: UAE Cyber Security Council
    jurisdiction: UAE (federal; federal entities and CII entities)
    document_date: "2023-05"
    status: draft
    binding: unknown
    notes: >-
      UAE text (UAE Cyber Security Council). Viewer page 18 is printed page 17. Version as
      printed: May 2023, Version 1.0 (cover); the file name says "V2.0". "is to" (as printed).
      Context for escalation: national cyber incidents only. Scope (as the human set it):
