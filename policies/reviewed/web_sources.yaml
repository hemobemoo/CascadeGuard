  - id: unesco.ai-ethics.human-oversight
    title: "UNESCO Recommendation: AI must not displace ultimate human responsibility"
    text: >-
      7. Human oversight and determination Member States should ensure that AI systems do not
      displace ultimate human responsibility and accountability.
    source_file: web/06_unesco_ai_ethics_recommendation.pdf
    page: 4
    article: "Core principles, 7 (web page summary)"
    issuer: UNESCO
    jurisdiction: International (UNESCO Member States; non-binding recommendation)
    document_date: "2021-11"
    status: draft
    binding: false
    notes: >-
      web transcription — unverified. The transcription is UNESCO's web page summary of the
      principle, not the Recommendation's text; replace with SHS/BIO/PI/2021/1 before review.
      International precedent, not UAE law. Cascade: precedent for a human owner of the review
      and reversal of the automated lockouts (orphan duty).

