# Gap examples only (human decision 2026-11-06, option (c)). Reviewed by the human as gap
# examples only: the quotes were checked against the PDF (pp. 15 and 50; printed pp. 1 and 36).
# These clauses are NEVER loaded into the simulation: the clause loader, RuleBook,
# clauses_for_role, role views, the knowledge-base search and the adviser's citable set read
# policies/reviewed/ only. Only the report builder (scripts/build_reports.py, via
# storage/reports.py) reads this folder, for gap_examples.yaml and docs/gap-analysis.md, where
# each clause shows its status label plus "reviewed as a gap example; not loaded into the
# simulation".
clauses:
  - id: nist.sp800-34.alternate-manual-means
    title: "NIST SP 800-34 Rev. 1: restore disrupted services, including by alternate (manual) processing means"
    text: >-
      Contingency planning generally includes one or more of the following approaches to
      restore disrupted services: [...] Restoring information systems using alternate
      equipment; [...] Performing some or all of the affected business processes using
      alternate processing (manual) means (typically acceptable for only short-term
      disruptions);
    source_file: nistspecialpublication800-34r1.pdf
    page: 15
    article: Chapter 1, Introduction
    issuer: US National Institute of Standards and Technology (NIST)
    jurisdiction: United States (federal guidance)
    document_date: "2010-05"
    status: reviewed
    binding: false
    notes: >-
      Foreign precedent (US federal contingency-planning guidance, outside the UAE); not
      AI-specific; not binding in the UAE. Viewer page 15 is printed page 1. Each [...] skips
      only a bullet glyph (extracted as
      "(cid:131)"); the quote stops after the second of four bullets. Candidate global example of
      an alternate (fallback) channel for a disrupted service; it does not say who activates it.
      Its automatic qualifier "foreign precedent" (US jurisdiction) is kept (human decision
      2026-11-06).

  - id: nist.sp800-34.activation-by-designated-authority
    title: "NIST SP 800-34 Rev. 1: the designated authority should activate the plan when activation criteria are met"
    text: >-
      The ISCP should be activated if one or more of the activation criteria for that system
      are met. If an activation criterion is met, the designated authority should activate the
      plan. [...] Activation criteria for system outages or disruptions are unique for each
      organization and should be stated in the contingency planning policy.
    source_file: nistspecialpublication800-34r1.pdf
    page: 50
    article: "4.2.1 Activation Criteria and Procedure"
    issuer: US National Institute of Standards and Technology (NIST)
    jurisdiction: United States (federal guidance)
    document_date: "2010-05"
    status: reviewed
    binding: false
    notes: >-
      Foreign precedent (US federal contingency-planning guidance, outside the UAE); not
      AI-specific; not binding in the UAE. Viewer page 50 is printed page 36. The [...] skips
      the footnote marker "31" after "plan."; footnote 31 (same page), word for word: "The
      designated authority (typically a senior manager or CIO) has the authority to activate the
      contingency plan. That authority may vary based on the organization or system, but the
      individual with this authority should be designated clearly in the plan. Only one
      individual should have this authority, and a successor should be clearly identified to
      assume that responsibility if necessary." The next paragraph of 4.2.1 (same page, not
      quoted) separates the roles: recovery teams "may be notified once the system outage or
      disruption has been identified and the ISCP Coordinator has determined that activation
      criteria have been met". Candidate global example for "who activates a fallback": one
      designated authority, named in the plan with a successor identified if necessary, acting on criteria stated in
      advance (a recommendation: "should"). Its automatic qualifier "foreign precedent" (US
      jurisdiction) is kept (human decision 2026-11-06).
