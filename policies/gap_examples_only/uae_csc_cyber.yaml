clauses:
  - id: uae.csc-ai-policy.2-4-2-redundancy-failover
    title: "UAE AI cyber security policy 2.4.2: the entity shall ensure resilience of AI/ML systems with redundancy and failover"
    text: >-
      The entity shall ensure the operational resilience of AI/ML systems by incorporating
      redundancy and failover mechanisms to maintain availability during disruptions.
    source_file: National Cyber Security Policy for Artificial Intelligence v1.1.pdf
    page: 15
    article: "2.4 Operational Security, policy statement 2.4.2"
    issuer: UAE Cyber Security Council
    jurisdiction: UAE (federal; federal entities and CII entities)
    document_date: "2025-11"
    status: draft
    binding: unknown
    notes: >-
      UAE text (UAE Cyber Security Council). Viewer page 15 is printed page 14. Version as
      printed: November 2025, Version 1.1 (cover); file name says v1.1. Policy statement
      ("shall", as printed). Scope (as the human set it): applies to federal entities and CII
      entities, for cybersecurity of AI/ML systems or cybersecurity information. Binding unknown
      for this scenario: the scenario's operators are not designated CII entities, and the
      incident is an AI model fault, not a cyber attack. Printed scope (p.8 of the PDF): applies
      to Ministries & Federal Authorities and Non-Government CII Entities; Emirate Government
      Entities through an Emirate CIIP Program, or directly where there is none. Legal status:
      Council-approved national policy (as printed on its cover); legal force for this scenario
      not established. Not redistributed: reproduction needs the UAE Cyber Security Council's
      prior written consent; the PDF and its extracted text are local only (NOT_REDISTRIBUTED).

  - id: uae.csc-ai-policy.3-4-3-redundant-systems-ready
    title: "UAE AI cyber security policy 3.4.3: redundant systems or alternative processes should be ready for immediate deployment"
