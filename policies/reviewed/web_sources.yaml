  - id: oecd.ai-principles.robustness-override
    title: "OECD AI Principles: harmful AI can be overridden, repaired or decommissioned"
    text: >-
      Mechanisms should be in place, as appropriate, to ensure that if AI systems risk causing
      undue harm or exhibit undesired behaviour, they can be overridden, repaired, and/or
      decommissioned safely as needed.
    source_file: web/07_oecd_ai_principles.pdf
    page: 3
    article: "Values-based principles: Robustness, security and safety (web page summary)"
    issuer: OECD
    jurisdiction: International (OECD adherents; non-binding recommendation; UAE adherence not checked)
    document_date: "2024"
    status: draft
    binding: false
    notes: >-
      web transcription — unverified. OECD web page text, not the Council Recommendation;
      replace with OECD/LEGAL/0449 before review. International precedent, not UAE law.
      Cascade: precedent for suspending the telecom traffic-management model and reversing the
      fraud model's automated lockouts.

  - id: oecd.ai-principles.accountability-cooperation
    title: "OECD AI Principles: risk management via co-operation between AI actors"
    text: >-
      AI actors, should, based on their roles, the context, and their ability to act, apply a
      systematic risk management approach to each phase of the AI system lifecycle on an
      ongoing basis and adopt responsible business conduct to address risks related to AI
      systems, including, as appropriate, via co-operation between different AI actors,
      suppliers of AI knowledge and AI resources, AI system users, and other stakeholders.
    source_file: web/07_oecd_ai_principles.pdf
    page: 4
    article: "Values-based principles: Accountability (web page summary)"
    issuer: OECD
    jurisdiction: International (OECD adherents; non-binding recommendation; UAE adherence not checked)
    document_date: "2024"
    status: draft
    binding: false
    notes: >-
      web transcription — unverified. OECD web page text, not the Council Recommendation;
      replace with OECD/LEGAL/0449 before review. International precedent, not UAE law.
      Cascade: precedent for co-operation between the two AI actors (telecom traffic model,
      health fraud model) whose interaction caused the lockouts.
