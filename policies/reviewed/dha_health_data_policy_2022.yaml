# Dubai Health Authority, Policy for Data and Health Information Protection and
# Confidentiality (DHA/HRS/HISHD/PP-11, version 1, issued 10/08/2022).
# The scenario places the synthetic portal operator under DHA jurisdiction (Dubai).
clauses:
  - id: dha.pp11.applicability
    title: Applicability of the DHA policy
    text: >-
      Applicability: All Healthcare Entities under the Jurisdiction of Dubai Health Authority
    source_file: Health Data Protection and Confidentiality Policy_EN2022810559.pdf
    page: 1
    article: Cover page
    issuer: Dubai Health Authority
    jurisdiction: Dubai, UAE
    document_date: "2022-08-10"
    status: draft
    binding: unknown
    notes: >-
      Applies only because the scenario places the portal operator in Dubai. Whether the policy
      is binding (and on whom) is for the human to confirm.

  - id: dha.pp11.4-18-1
    title: Incident response and business continuity plans
    text: >-
      4.18.1. Entities must establish breach/incidence response management (Incident Response
      and Business Continuity) and recovery (Incident Recovery and Disaster Recovery) plans
      that comprise of:
    source_file: Health Data Protection and Confidentiality Policy_EN2022810559.pdf
    page: 30
    article: "4.18.1"
    issuer: Dubai Health Authority
    jurisdiction: Dubai, UAE
    document_date: "2022-08-10"
    status: draft
    binding: unknown
    normalized:
      kind: obligation
      actor: health_service_operator
      action: activate_fallback_channel
      condition: business continuity plan in place for incidents
    notes: >-
      Binding status: see dha.pp11.applicability. Requires entities to establish continuity and
      recovery plans; the listed plan contents (PDF pages 30-31) do not mention a fallback
      channel, and it says nothing about who may reverse an automated account lock, or when.
      Mapping it to `activate_fallback_channel` is an interpretation.

  - id: dha.pp11.4-18-2
    title: Investigate incidents from discovery, including whether PHI was affected
    text: >-
      4.18.2. Entities must thoroughly investigate the breaches/incidents starting from the
      point of discovery until closure: aa.. Determine if the breach is related to a violation
      of PHI.
    source_file: Health Data Protection and Confidentiality Policy_EN2022810559.pdf
    page: 31
    article: "4.18.2"
    issuer: Dubai Health Authority
    jurisdiction: Dubai, UAE
    document_date: "2022-08-10"
    status: draft
    binding: unknown
    normalized:
      kind: obligation
      actor: health_service_operator
      action: raise_security_incident
      condition: from discovery of a breach or incident until closure
    notes: >-
      Binding status: see dha.pp11.applicability. Supports treating the fraud-model alert as an
      incident to be investigated, not as an established breach. The quote stops after item aa;
      item bb (PDF page 31) reads "Determine if further investigation is warranted, and if not,
      then document the incident and retain". The text requires investigation;
      `raise_security_incident` is the scenario action id mapped to it, and "suspected" is the
      scenario's wording, not the policy's. ("aa.." is how the PDF's list marker extracts.)

  - id: dha.pp11.4-18-4
    title: Breach reporting period borrowed from the UAE Data Protection Law
    text: >-
      4.18.4. The Entity is required to report breaches/incidents within the designated period
      defined by Executive Regulations of UAE Data Protection Law.
    source_file: Health Data Protection and Confidentiality Policy_EN2022810559.pdf
    page: 32
    article: "4.18.4"
    issuer: Dubai Health Authority
    jurisdiction: Dubai, UAE
    document_date: "2022-08-10"
    status: draft
    binding: unknown
    normalized:
      kind: obligation
      actor: health_service_operator
      action: notify_health_data_oversight
      condition: breach or incident; period set by PDPL Executive Regulations (not in corpus)
    notes: >-
      Binding status: see dha.pp11.applicability. The policy itself defines "UAE Data Protection
      Law" as "UAE Federal Data Protection law No. (45) of year 2021" (section 4.2, PDF pages
      9-10), and section 4.2 adds: "Nevertheless, the regulation that is more specialized/detailed
      in health will supersede." Candidate mandate-overlap finding: the period comes from the
      PDPL's Executive Regulations (not in the corpus), while the PDPL may exclude regulated
      health data (uae.pdpl.art2-2) and the policy's own precedence rule points to the more
      specialised health regulation. This paragraph names no recipient; the recipient in
      `notify_health_data_oversight` comes from 4.18.5 (dha.pp11.4-18-5).

  - id: dha.pp11.4-18-5
    title: Breach notifications go to the UAE Information Office and DHA
    text: >-
      4.18.5. Breach notifications must be reported to both the UAE Information Office and DHA
    source_file: Health Data Protection and Confidentiality Policy_EN2022810559.pdf
    page: 32
    article: "4.18.5"
    issuer: Dubai Health Authority
    jurisdiction: Dubai, UAE
    document_date: "2022-08-10"
    status: draft
    binding: unknown
    normalized:
      kind: obligation
      actor: health_service_operator
      action: notify_health_data_oversight
      condition: a breach/incident report under 4.18.4 (dha.pp11.4-18-4)
    notes: >-
      Binding status: see dha.pp11.applicability. The text names "both the UAE Information Office
      and DHA"; the scenario models only the health-data oversight role, not a separate national
      data office. The PDF continues with a DHA email address, which is left out here.
