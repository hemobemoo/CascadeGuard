[project]
name = "cascadeguard"
version = "0.1.0"
description = "Cross-agency policy crash-testing for AI-dependent public services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "networkx>=3.7",
    "nicegui>=3.18.0",
    "openai>=3.37.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
cascadeguard = "cascadeguard.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # docs are not reformatted by Ruff

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: browser smoke test of the demo UI (Playwright, Chromium); skip locally with -m 'not e2e'",
    "perf: demo UI timing budgets (spec 006); CI always runs them; skip locally with -m 'not perf'",
]
