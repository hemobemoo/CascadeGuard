# International precedents and frameworks. None of these is UAE law; they inform gap analysis
# only (CascadeGuard.md s.7).
clauses:
  - id: nist.ai-rmf.govern-2-1
    title: "NIST AI RMF: roles, responsibilities and lines of communication are documented"
    text: >-
      Govern 2.1: Roles and responsibilities and lines of communication related to mapping,
      measuring, and managing AI risks are documented and are clear to individuals and teams
      throughout the organization.
    source_file: 5 AI RMF Core - Excerpt from the NIST AI Risk Management Framework 1.0 (2023)..pdf
    page: 3
    article: GOVERN 2.1
    issuer: US National Institute of Standards and Technology (NIST)
    jurisdiction: United States (voluntary framework)
    document_date: "2023"
    status: draft
    binding: false

  - id: nist.ai-rmf.manage-2-4
    title: "NIST AI RMF: assigned responsibility to supersede, disengage or deactivate AI"
    text: >-
      Manage 2.4: Mechanisms are in place and applied, and responsibilities are assigned and
      understood, to supersede, disengage, or deactivate AI systems that demonstrate
      performance or outcomes inconsistent with intended use.
    source_file: 5 AI RMF Core - Excerpt from the NIST AI Risk Management Framework 1.0 (2023)..pdf
    page: 10
    article: MANAGE 2.4
    issuer: US National Institute of Standards and Technology (NIST)
    jurisdiction: United States (voluntary framework)
    document_date: "2023"
    status: draft
    binding: false
    notes: Precedent for assigning an owner to reverse an automated decision.

  - id: nist.ai-rmf.manage-4-3
    title: "NIST AI RMF: incidents communicated to relevant AI actors"
    text: >-
      Manage 4.3: Incidents and errors are communicated to relevant AI actors, including
      affected communities. Processes for tracking, responding to, and recovering from
      incidents and errors are followed and documented.
    source_file: 5 AI RMF Core - Excerpt from the NIST AI Risk Management Framework 1.0 (2023)..pdf
    page: 10
    article: MANAGE 4.3
    issuer: US National Institute of Standards and Technology (NIST)
    jurisdiction: United States (voluntary framework)
    document_date: "2023"
    status: draft
    binding: false
    notes: Precedent for cross-organisation incident communication.

  - id: eu.ai-act.art14-4-d
    title: "EU AI Act: humans can disregard, override or reverse high-risk AI output"
    text: >-
      (d) to decide, in any particular situation, not to use the high-risk AI system or to
      otherwise disregard, override or reverse the output of the high-risk AI system;
    source_file: EU AI Act, Regulation (EU) 2024-1689.pdf
    page: 61
    article: Article 14(4)(d)
    issuer: European Union
    jurisdiction: EU
    document_date: "2024-06-13"
    status: draft
    binding: false
    notes: >-
      Binding in the EU for high-risk AI systems; not binding in the UAE. Precedent for a
      human able to reverse an automated lockout. Qualified by the Art 14(4) chapeau (PDF page
      60): the system "shall be provided to the deployer in such a way that natural persons to
      whom human oversight is assigned are enabled, as appropriate and proportionate". It is a
      design duty on the provider, not a free-standing right to reverse.
      Unchanged by the 2026 amendment (Regulation (EU) 2026/1744; checked on EUR-Lex, 2026-10-23, https://eur-lex.europa.eu/eli/reg/2026/1744/oj; that source is not in the reviewed corpus).

  - id: eu.ai-act.art73-1
    title: "EU AI Act: providers report serious incidents"
    text: >-
      1. Providers of high-risk AI systems placed on the Union market shall report any serious
      incident to the market surveillance authorities of the Member States where that incident
      occurred.
    source_file: EU AI Act, Regulation (EU) 2024-1689.pdf
    page: 101
    article: Article 73(1)
    issuer: European Union
    jurisdiction: EU
    document_date: "2024-06-13"
    status: draft
    binding: false
    notes: >-
      Not binding in the UAE. Precedent for AI serious-incident reporting.
      Unchanged by the 2026 amendment (Regulation (EU) 2026/1744; checked on EUR-Lex, 2026-10-23, https://eur-lex.europa.eu/eli/reg/2026/1744/oj; that source is not in the reviewed corpus). Regulation (EU) 2026/1744 inserts Article 75(1a), a derogation from Article 73 for providers under the AI Office's competence, who report to the AI Office instead; Article 73's text is not amended.

  - id: eu.ai-act.art73-3
    title: "EU AI Act: two-day report for critical-infrastructure disruption"
    text: >-
      3. Notwithstanding paragraph 2 of this Article, in the event of a widespread infringement
      or a serious incident as defined in Article 3, point (49)(b), the report referred to in
      paragraph 1 of this Article shall be provided immediately, and not later than two days
      after the provider or, where applicable, the deployer becomes aware of that incident.
    source_file: EU AI Act, Regulation (EU) 2024-1689.pdf
    page: 102
    article: Article 73(3)
    issuer: European Union
    jurisdiction: EU
    document_date: "2024-06-13"
    status: draft
    binding: false
    notes: >-
      Not binding in the UAE. Article 3(49)(b) (PDF page 49) covers "a serious and
      irreversible disruption of the management or operation of critical infrastructure"; the
      closest precedent for the telecom-side failure, though a recoverable degradation may not
      be "irreversible".
      Unchanged by the 2026 amendment (Regulation (EU) 2026/1744; checked on EUR-Lex, 2026-10-23, https://eur-lex.europa.eu/eli/reg/2026/1744/oj; that source is not in the reviewed corpus). Regulation (EU) 2026/1744 inserts Article 75(1a), a derogation from Article 73 for providers under the AI Office's competence, who report to the AI Office instead; Article 73's text is not amended.

  - id: eu.gdpr.art22-3
    title: "GDPR: human intervention and right to contest automated decisions"
    text: >-
      3. In the cases referred to in points (a) and (c) of paragraph 2, the data controller
      shall implement suitable measures to safeguard the data subject's rights and freedoms and
      legitimate interests, at least the right to obtain human intervention on the part of the
      controller, to express his or her point of view and to contest the decision.
    source_file: GDPR-Regulation (EU) 2016-679.pdf
    page: 21
    article: Article 22(3)
    issuer: European Union
    jurisdiction: EU
    document_date: "2016-04-27"
    status: draft
    binding: false
    notes: >-
      Not binding in the UAE. Precedent for contesting an automated lockout. The PDF is the
      consolidated text, which states it is a documentation tool with no legal effect (PDF
      page 1).
      Unchanged by the 2026 amendment (Regulation (EU) 2026/1744 does not amend Regulation (EU) 2016/679; EUR-Lex lists only corrigenda for it; checked on EUR-Lex, 2026-10-23, https://eur-lex.europa.eu/eli/reg/2026/1744/oj; that source is not in the reviewed corpus).

  - id: eu.gdpr.art33-1
    title: "GDPR: breach notification within 72 hours unless unlikely to result in risk"
    text: >-
      1. In the case of a personal data breach, the controller shall without undue delay and,
      where feasible, not later than 72 hours after having become aware of it, notify the
      personal data breach to the supervisory authority competent in accordance with Article
      55, unless the personal data breach is unlikely to result in a risk to the rights and
      freedoms of natural persons.
    source_file: GDPR-Regulation (EU) 2016-679.pdf
    page: 29
    article: Article 33(1)
    issuer: European Union
    jurisdiction: EU
    document_date: "2016-04-27"
    status: draft
    binding: false
    notes: >-
      Not binding in the UAE. Precedent with an explicit regulator-notification deadline. No
      explicit regulator-notification deadline was found in the reviewed corpus for UAE health
      data (see dha.pp11.4-18-4, uae.pdpl.art9-1); candidate finding, not a confirmed gap. The
      DHA policy does state a risk threshold for informing data subjects (4.18.10, PDF page 33)
      and "immediately" for processor-to-controller notice (4.18.7). The PDF is the
      consolidated text, which states it is a documentation tool with no legal effect (PDF
      page 1).
      Unchanged by the 2026 amendment (Regulation (EU) 2026/1744 does not amend Regulation (EU) 2016/679; EUR-Lex lists only corrigenda for it; checked on EUR-Lex, 2026-10-23, https://eur-lex.europa.eu/eli/reg/2026/1744/oj; that source is not in the reviewed corpus).

  - id: oecd.ai-incidents.definition
    title: "OECD: definition of an AI incident"
    text: >-
      An AI incident is an event, circumstance or series of events where the development, use
      or malfunction of one or more AI systems directly or indirectly leads to any of the
      following harms: (a) injury or harm to the health of a person or groups of people; (b)
      disruption of the management and operation of critical infrastructure;
    source_file: OCED-Towards a common reporting framework for AI incidents.pdf
    page: 11
    article: Box 1.1
    issuer: OECD
    jurisdiction: International (OECD paper)
    document_date: "2025-02"
    status: draft
    binding: false
    notes: >-
      Common terminology for classifying the scenario's cascade as an AI incident. The quote
      stops after harm (b); harms (c) and (d) follow on the same page.

  # Phase 6d: UNESCO and OECD clauses re-quoted from the official originals (formerly quoted from
  # the web transcriptions 06 and 07, which MANIFEST.md now marks superseded).
  - id: unesco.ai-ethics.human-oversight
    title: "UNESCO Recommendation: responsibility attributable to persons; AI never replaces ultimate human responsibility"
    text: >-
      35. Member States should ensure that it is always possible to attribute ethical and legal
      responsibility for any stage of the life cycle of AI systems, as well as in cases of
      remedy related to AI systems, to physical persons or to existing legal entities. Human
      oversight refers thus not only to individual human oversight, but to inclusive public
      oversight, as appropriate. 36. It may be the case that sometimes humans would choose to
      rely on AI systems for reasons of efficacy, but the decision to cede control in limited
      contexts remains that of humans, as humans can resort to AI systems in decision-making and
      acting, but an AI system can never replace ultimate human responsibility and
      accountability. As a rule, life and death decisions should not be ceded to AI systems.
    source_file: UNESCO Recommendation on the Ethics of Artificial Intelligence.pdf
    page: 22
    article: "III.2 Principles, Human oversight and determination, paras 35-36"
    issuer: UNESCO General Conference
    jurisdiction: International (UNESCO Member States; non-binding recommendation)
    document_date: "2021-11-23"
    status: draft
    binding: false
    notes: >-
      Official original (SHS/BIO/PI/2021/1, p.2). Not binding: operative para 2 "Recommends that
      Member States apply on a voluntary basis the provisions of this Recommendation" (p.7).
      International precedent, not UAE law. Cascade: precedent for a human owner of the review
      and reversal of the automated lockouts (candidate orphan duty; cf.
      uae.ai-charter.human-oversight, uae.pdpl.art18-1).

  - id: unesco.ai-ethics.review-and-correct
    title: "UNESCO Recommendation: submissions to a designated staff member able to review and correct the decision"
    text: >-
      In addition, individuals should be able to access the reasons for a decision affecting
      their rights and freedoms, and have the option of making submissions to a designated staff
      member of the private [...] sector company or public sector institution able to review and
      correct the decision.
    source_file: UNESCO Recommendation on the Ethics of Artificial Intelligence.pdf
    page: 22
    article: "III.2 Principles, Transparency and explainability, para 38"
    issuer: UNESCO General Conference
    jurisdiction: International (UNESCO Member States; non-binding recommendation)
    document_date: "2021-11-23"
    status: draft
    binding: false
    notes: >-
      Official original (SHS/BIO/PI/2021/1). The [...] skips only the page number "22", printed
      between the bottom of the left column and the top of the right column. Not binding:
      operative para 2, "apply on a voluntary basis" (p.7). International precedent, not UAE
      law; no normalized obligation. Cascade: precedent for a named person able to review and
      correct the fraud model's lockout decisions (candidate finding: no owner found in the
      reviewed corpus; cf. uae.ai-charter.human-oversight, uae.pdpl.art18-1).

  - id: unesco.ai-ethics.responsibility-accountability
    title: "UNESCO Recommendation: oversight, impact assessment, audit and due diligence; auditability and traceability"
    text: >-
      43. Appropriate oversight, impact assessment, audit and due diligence mechanisms, including
      whistle-blowers [...] protection, should be developed to ensure accountability for AI
      systems and their impact throughout their life cycle. Both technical and institutional
      designs should ensure auditability and traceability of (the working of) AI systems in
      particular to address any conflicts with human rights norms and standards and threats to
      environmental and ecosystem well-being.
    source_file: UNESCO Recommendation on the Ethics of Artificial Intelligence.pdf
    page: 23
    article: "III.2 Principles, Responsibility and accountability, para 43"
    issuer: UNESCO General Conference
    jurisdiction: International (UNESCO Member States; non-binding recommendation)
    document_date: "2021-11-23"
    status: draft
    binding: false
    notes: >-
      Official original (SHS/BIO/PI/2021/1). The [...] skips one character the extraction gives
      as U+FFFD (the apostrophe of "whistle-blowers'"). Para 42 starts on p.22 and ends on p.23,
      so it is not quoted (a clause cites one page); its last sentence reads "The ethical
      responsibility and liability for the decisions and actions based in any way on an AI
      system should always ultimately be attributable to AI actors corresponding to their role
      in the life cycle of the AI system." Not binding: operative para 2, "apply on a voluntary
      basis" (p.7). International precedent, not UAE law. Cascade: precedent for tracing the
      lockouts back to the telecom traffic model's update.

  - id: oecd.ai-principles.robustness-override
    title: "OECD AI Recommendation: harmful AI can be overridden, repaired or decommissioned"
    text: >-
      b) Mechanisms should be in place, as appropriate, to ensure that if AI systems risk causing
      undue harm or exhibit undesired behaviour, they can be overridden, repaired, and/or
      decommissioned safely as needed.
    source_file: OECD_Recommendation_AI.pdf
    page: 9
    article: "Section 1, 1.4 Robustness, security and safety, b)"
    issuer: OECD Council
    jurisdiction: International (OECD Adherents; non-binding recommendation; UAE adherence not checked)
    document_date: "2024-05-03"
    status: draft
    binding: false
    notes: >-
      Official original, OECD/LEGAL/0449 (adopted 22 May 2019; revised 8 November 2023 and 3 May
      2024, p.3). Not binding: "Recommendations are adopted by Council and are not legally
      binding" (OECD Legal Instruments, p.12). The PDF lists no Adherents; UAE adherence not
      checked. International precedent, not UAE law. Cascade: precedent for
      suspending the telecom traffic-management model and reversing the fraud model's automated
      lockouts.

  - id: oecd.ai-principles.accountability-cooperation
    title: "OECD AI Recommendation: risk management via co-operation between AI actors"
    text: >-
      c) AI actors, should, based on their roles, the context, and their ability to act, apply a
      systematic risk management approach to each phase of the AI system lifecycle on an ongoing
      basis and adopt responsible business conduct to address risks related to AI systems,
      including, as appropriate, via co-operation between different AI actors, suppliers of AI
      knowledge and AI resources, AI system users, and other stakeholders.
    source_file: OECD_Recommendation_AI.pdf
    page: 9
    article: "Section 1, 1.5 Accountability, c)"
    issuer: OECD Council
    jurisdiction: International (OECD Adherents; non-binding recommendation; UAE adherence not checked)
    document_date: "2024-05-03"
    status: draft
    binding: false
    notes: >-
      Official original, OECD/LEGAL/0449 (p.3 for dates). The quote ends at a sentence boundary;
      the next sentence only lists examples of risks. Not binding: "Recommendations are adopted
      by Council and are not legally binding" (OECD Legal Instruments, p.12). International
      precedent, not UAE law. Cascade: precedent for co-operation between the two AI actors
      (telecom traffic model, health fraud model) whose interaction caused the lockouts.
