# Clauses quoted from the web transcriptions in policies/sources/web/ (Phase 6c, spec 006c).
# Each file is an official web page printed to PDF by the human: unverified, and not the original
# document (see policies/sources/web/MANIFEST.md). Every clause here is a policy or strategy aim:
# binding false (or unknown, with the reason in notes), no normalized reading. A power or aim to
# regulate is never read as a duty. The 06 UNESCO and 07 OECD clauses moved to
# international_precedents.yaml in Phase 6d, re-quoted from the official originals.
clauses:
  - id: uae.mohap-smart-health.p2-coordination
    title: "Smart health AI policy: coordination through national partnerships"
    text: >-
      Strengthening coordination through national partnerships.
    source_file: web/01_uae_smart_health_ai_policy.pdf
    page: 3
    article: "Priorities and Key Components, 2 (Building partnerships at all levels and achieving integration), first item"
    issuer: Ministry of Health and Prevention (lead entity, as printed)
    jurisdiction: UAE (federal public policy, health sector)
    document_date: "2026-05-18"
    status: draft
    binding: unknown
    notes: >-
      web transcription — unverified (uaelegislation.gov.ae policy page; MANIFEST.md row 01).
      binding unknown: national public policy; legal effect not verified.
      Public policy priority, not legislation: it names no actor, counterpart, data category or
      deadline, so it carries no normalized reading and authorises no share. Cascade: context
      for the information deadlock between the telecom operator and the health service operator
      (network_incident_status); it does not permit the telecom-to-health status share.

  - id: uae.mohap-smart-health.p6-cybersecurity
    title: "Smart health AI policy: integrated cybersecurity system for the healthcare sector"
    text: >-
      Strengthening an integrated cybersecurity system for the healthcare sector.
    source_file: web/01_uae_smart_health_ai_policy.pdf
    page: 4
    article: "Priorities and Key Components, 6 (Ensuring the security and ethics of smart health services), first item"
    issuer: Ministry of Health and Prevention (lead entity, as printed)
    jurisdiction: UAE (federal public policy, health sector)
    document_date: "2026-05-18"
    status: draft
    binding: unknown
    notes: >-
      web transcription — unverified (uaelegislation.gov.ae policy page; MANIFEST.md row 01).
      binding unknown: national public policy; legal effect not verified.
      Public policy priority, not legislation: no reporting duty, regulator or deadline is read
      from it. Cascade: context for the health service operator's security incident at T+15,
      raised on a suspected (unconfirmed) credential-stuffing alert from its own AI fraud model.

  - id: uae.mohap-smart-health.p7-liability
    title: "Smart health AI policy: clear medical liability frameworks for AI in health"
    text: >-
      Establishing clear medical liability frameworks for the delivery of smart health services
      and the use of artificial intelligence applications across the healthcare sector.
    source_file: web/01_uae_smart_health_ai_policy.pdf
    page: 4
    article: "Priorities and Key Components, 7 (Ensuring the ethical use of smart health services and AI), second item"
    issuer: Ministry of Health and Prevention (lead entity, as printed)
    jurisdiction: UAE (federal public policy, health sector)
    document_date: "2026-05-18"
    status: draft
    binding: unknown
    notes: >-
      web transcription — unverified (uaelegislation.gov.ae policy page; MANIFEST.md row 01).
      binding unknown: national public policy; legal effect not verified.
      An aim to establish liability frameworks, not a framework and not a duty: it assigns no
      owner. Cascade: context for the orphan duty to review and reverse the AI fraud model's
      automated lockouts (candidate finding: no owner found in the reviewed corpus; cf.
      uae.ai-charter.human-oversight, uae.pdpl.art18-1). Whether the portal's
      fraud-risk model is an "artificial intelligence application" in the policy's sense is not
      decided.

  - id: uae.cyber-strategy-2025.governance-aim
    title: "National Cybersecurity Strategy 2025: cohesive cybersecurity governance framework (aim)"
    text: >-
      Establish a cohesive and highly effective governance framework for cybersecurity.
    source_file: web/03_uae_national_cybersecurity_strategy.pdf
    page: 2
    article: "Cabinet approval announcement, 'The strategy seeks to', first item"
    issuer: UAE Cabinet (approval announcement, as transcribed)
    jurisdiction: UAE (national strategy)
    document_date: "2025-02-03"
    status: draft
    binding: false
    notes: >-
      web transcription — unverified (summary of the Cabinet approval announcement; MANIFEST.md
      row 03). Not the strategy text: the Cyber Security Council strategy document is not in the
      repository. Strategy-level context only: no deadline, regulator or reporting duty is
      inferred. Cascade: context for the two security incidents (telecom and health) handled
      without a shared escalation path.

  - id: uae.cyber-strategy-2025.partnership-aim
    title: "National Cybersecurity Strategy 2025: national and international partnerships (aim)"
    text: >-
      Bolster partnerships and collaborative relations at national and international levels.
    source_file: web/03_uae_national_cybersecurity_strategy.pdf
    page: 2
    article: "Cabinet approval announcement, 'The strategy seeks to', fifth item"
    issuer: UAE Cabinet (approval announcement, as transcribed)
    jurisdiction: UAE (national strategy)
    document_date: "2025-02-03"
    status: draft
    binding: false
    notes: >-
      web transcription — unverified (summary of the Cabinet approval announcement; MANIFEST.md
      row 03). Not the strategy text. Strategy-level context only: it authorises no data share
      and sets no duty. Cascade: context for the cross-sector information deadlock between the
      telecom and health operators.
