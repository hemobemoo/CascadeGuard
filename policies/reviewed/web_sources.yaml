    text: >-
      Strengthening an integrated cybersecurity system for the healthcare sector.
    source_file: web/01_uae_smart_health_ai_policy.pdf
    page: 4
    article: "Priorities and Key Components, 6 (Ensuring the security and ethics of smart health services), first item"
    issuer: Ministry of Health and Prevention (lead entity, as printed)
    jurisdiction: UAE (federal public policy, health sector)
    document_date: "2026-05-18"
    status: draft
    binding: false
    notes: >-
      web transcription — unverified (uaelegislation.gov.ae policy page; MANIFEST.md row 01).
      Public policy priority, not legislation: no reporting duty, regulator or deadline is read
      from it. Cascade: context for the health service operator's security incident at T+15,
      raised on a suspected (unconfirmed) credential-stuffing alert from its own AI fraud model.

  - id: uae.mohap-smart-health.p7-liability
    title: "Smart health AI policy: clear medical liability frameworks for AI in health"
    text: >-
      Establishing clear medical liability frameworks for the delivery of smart health services
      and the use of artificial intelligence applications across the healthcare sector.
    source_file: web/01_uae_smart_health_ai_policy.pdf
    page: 4
    article: "Priorities and Key Components, 7 (Ensuring the ethical use of smart health services and AI), second item"
    issuer: Ministry of Health and Prevention (lead entity, as printed)
    jurisdiction: UAE (federal public policy, health sector)
    document_date: "2026-05-18"
    status: draft
    binding: false
    notes: >-
      web transcription — unverified (uaelegislation.gov.ae policy page; MANIFEST.md row 01).
      An aim to establish liability frameworks, not a framework and not a duty: it assigns no
      owner. Cascade: context for the orphan duty to review and reverse the AI fraud model's
      automated lockouts (no owner found in the reviewed corpus). Whether the portal's
      fraud-risk model is an "artificial intelligence application" in the policy's sense is not
      decided.

