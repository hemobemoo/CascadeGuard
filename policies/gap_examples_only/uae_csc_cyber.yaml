      printed: May 2023, Version 1.0 (cover); the file name says "V2.0". Descriptive (no modal
      verb). The printed page number is extracted as "2233" (doubled glyphs); the page is
      printed 23. Scope (as the human set it): applies to federal entities and CII entities, for
      cybersecurity of AI/ML systems or cybersecurity information. Binding unknown for this
