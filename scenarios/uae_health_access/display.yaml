# Display labels for the demo UI only (spec 006b). Read by src/cascadeguard/ui/ and nothing
# else: never by the engine, the agents, the simulation or the exports, and not part of any
# cache key. Labels are pure renames of the ids (no added meaning, status or legal claim).
# Role names come from roles.yaml `name`, unchanged. Everything here is synthetic.

incident_summary: >-
  Hypothetical scenario with synthetic data: a telecom AI model delays one-time-password SMS, a
  health portal's AI fraud model reads the patients' retries as an attack and locks their
  accounts, and the information that would explain the locks sits with another organisation.

