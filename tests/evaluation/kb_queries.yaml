  - id: health-02
    topic: health data sharing
    query: When may patient information be disclosed without breaching confidentiality?
    expect_source: UAE Federal Law No. 2 of 2019. The Use of ICT in Health Fields..pdf
    expect_page: 5
    also_relevant:
      - {source: UAE Federal Law No. 2 of 2019. The Use of ICT in Health Fields..pdf, page: 4}
  - id: health-03
    topic: health data sharing
    query: Does the UAE personal data protection law apply to health data governed by its own legislation?
    expect_source: Federal Decree by Law No. (45) of 2021 Concerning the Protection of Personal Data.pdf
    expect_page: 6
  # Telecom duties
