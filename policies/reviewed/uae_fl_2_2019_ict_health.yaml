# Federal Law No. 2 of 2019 concerning the Use of ICT in Health Fields (English translation in
# the source PDF). Drafted by the agent; the human checks each clause against the PDF.
clauses:
  - id: uae.fl2-2019.art2
    title: Scope of the law
    text: >-
      This Law shall apply to all methods and uses of the information and communication
      technology in the areas of health in State, including the free zones.
    source_file: UAE Federal Law No. 2 of 2019. The Use of ICT in Health Fields..pdf
    page: 2
    article: Article (2)
    issuer: United Arab Emirates (federal)
    jurisdiction: UAE
    document_date: "2019"
    status: draft
    binding: true
    notes: >-
      Used to determine the applicable health-data regime: the synthetic patient portal is an
      ICT use in the area of health, so this law applies.

  - id: uae.fl2-2019.art4
    title: Confidentiality, integrity and availability of health data
    text: >-
      Upon using the information and communication technology in the areas of health, it shall
      be committed to the following: 1. To keep the confidentiality of health data and
      information by not allowing to circulate them in cases other than the permitted. [...]
      3. To ensure the availability of health data and information to the authorised thereof
      and facilitate the access thereto, if needed.
    source_file: UAE Federal Law No. 2 of 2019. The Use of ICT in Health Fields..pdf
    page: 3
    article: Article (4)(1) and (4)(3)
    issuer: United Arab Emirates (federal)
    jurisdiction: UAE
    document_date: "2019"
    status: draft
    binding: true
    normalized:
      kind: prohibition
      actor: health_service_operator
      action: share_incident_status
      data_category: patient_account_records
      condition: circulation is not one of the permitted cases (see uae.fl2-2019.art16)
    notes: >-
      Para (1) is the safeguard the engine enforces: identifiable patient records may not be
      shared outside permitted cases. Para (3) (availability to the authorised) is relevant to
      keeping patients able to reach their own records during the lockout.

  - id: uae.fl2-2019.art6
    title: Health Authority sets standards for exchange, protection and risk management
    text: >-
      The Health Authority shall set the bases, standards and controls required to the
      electronic systems of its health data and information, such as its operation methods and
      how to exchange the data and information, protect, access, copy and change and check
      them, as well as the proper and safe uses to them, and to manage the risk of the health
      information and data.
    source_file: UAE Federal Law No. 2 of 2019. The Use of ICT in Health Fields..pdf
    page: 3
    article: Article (6)
    issuer: United Arab Emirates (federal)
    jurisdiction: UAE
    document_date: "2019"
    status: draft
    binding: true
    normalized:
      kind: permission
      actor: health_data_oversight
      action: issue_determination
      condition: on how health data and information may be exchanged and protected
    notes: >-
      Basis for the health-data oversight role's authority to determine how health data may be
      exchanged. Mapping the scenario role to "the Health Authority" is an interpretation.

  - id: uae.fl2-2019.art16
    title: Confidentiality of patient information and its exceptions
    text: >-
      Without violation to any applicable legislations, whoever circulates information related
      to the patients must keep its confidentiality and not to use them except in the health
      purposes without written approval from the patient, except in any of the following cases:
    source_file: UAE Federal Law No. 2 of 2019. The Use of ICT in Health Fields..pdf
    page: 4
    article: Article (16)
    issuer: United Arab Emirates (federal)
    jurisdiction: UAE
    document_date: "2019"
    status: draft
    binding: true
    normalized:
      kind: safeguard
      actor: any
      action: share_incident_status
      data_category: patient_account_records
      condition: >-
        only for health purposes, with written patient approval, or under one of the five
        listed exceptions (PDF page 5)
    notes: >-
      The five exceptions are on PDF page 5. None of them names incident coordination with a
      telecom operator; whether exception 3 or 5 could apply is a question for a human expert.
