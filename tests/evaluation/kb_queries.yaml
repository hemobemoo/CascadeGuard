# Retrieval evaluation queries for the knowledge base (Task 4, human brief of 2026-11-05;
# gate 4 approved 2026-11-06). Written and committed on 2026-11-06 BEFORE any query was embedded
# or searched: that commit is the proof (`git log -- tests/evaluation/kb_queries.yaml`). Expected
# pages were chosen by reading the indexed chunk text (policies/kb/chunks.jsonl) and the clause
# files, never from search results. Queries and expected pages are not reworded after seeing
# results, and the ranking is not tuned to them.
#
# Expected sources are documents in the current KB index only (policies/kb/chunks.jsonl), never
# the NIST excerpt and never the CSC PDFs (not indexed). Pages are PDF pages, as in the index.
#
# Rules fixed before looking:
# - Search: `kb.search_kb` as committed (hybrid, RRF, at most 2 chunks per document), k = 10,
#   with the query vectors stored by scripts/embed_eval_queries.py (one request).
# - A hit is relevant when its (source_file, page), or the location of one of its exact copies
#   (`Chunk.also_in`), is the expected page or one listed under `also_relevant`.
# - Precision@3: relevant hits among the top 3, divided by 3 (several chunks of one relevant page
#   each count). Recall@5: distinct relevant pages found in the top 5, divided by the number of
#   relevant pages. MRR@10: 1 / rank of the first relevant hit in the top 10, else 0. All three
#   averaged over the answerable queries only.
# - The `expect: nothing` queries are outside the corpus: they are not scored; their top 5 hits
#   and scores are reported as they are. No relevance threshold is set.
queries:
  # AI governance
  - id: gov-01
    topic: AI governance
    query: Which UAE principle requires AI systems that pose risks to be modified or withdrawn?
    expect_source: The UAE Charter for the Development and Use of Artificial Intelligence.pdf
    expect_page: 3
  - id: gov-02
    topic: AI governance
    query: governance and accountability principle for artificial intelligence in the UAE
    expect_source: The UAE Charter for the Development and Use of Artificial Intelligence.pdf
    expect_page: 4
  - id: gov-03
    topic: AI governance
    query: UAE national AI strategy objective on strong governance and effective regulation
    expect_source: UAE-National-Strategy-for-Artificial-Intelligence-2031.pdf
    expect_page: 22
  - id: gov-04
    topic: AI governance
    query: how is an AI incident defined for a common cross-country reporting framework
    expect_source: OCED-Towards a common reporting framework for AI incidents.pdf
    expect_page: 11
  # Health data sharing
  - id: health-01
    topic: health data sharing
    query: Who sets the standards for exchanging and protecting health data in the UAE?
    expect_source: UAE Federal Law No. 2 of 2019. The Use of ICT in Health Fields..pdf
