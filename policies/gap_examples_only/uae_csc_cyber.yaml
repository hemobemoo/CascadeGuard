  - id: uae.csc-ai-policy.3-6-2-automated-response-human-intervention
    title: "UAE AI cyber security policy 3.6.2: automated response on predefined conditions; a fail-safe for timely human intervention (should)"
    text: >-
      The entity should consider automated response mechanisms for AI/ML security incidents to
      mitigate the impact of attacks and prevent further escalation such as isolating affected
      systems, adjusting security controls, or blocking network traffic, based on predefined
      conditions and incident severity levels. [...] In cases where automated response
      mechanisms may not be suitable, or fully effective, the entity should implement a
      fail-safe mechanism that allows for timely and informed human intervention.
    source_file: National Cyber Security Policy for Artificial Intelligence v1.1.pdf
    page: 41
    article: "3.6.2 Incident Reporting and Management for AI/ML (implementation guidance)"
    issuer: UAE Cyber Security Council
    jurisdiction: UAE (federal; federal entities and CII entities)
    document_date: "2025-11"
    status: draft
    binding: unknown
    notes: >-
      UAE text (UAE Cyber Security Council). Viewer page 41 is printed page 40. Version as
      printed: November 2025, Version 1.1 (cover); file name says v1.1. Implementation guidance
      ("should", as printed). The [...] skips only the bullet glyph "•" between two consecutive
      bullets. About AI/ML security incidents (attacks), not model faults. Scope (as the human
      set it): applies to federal entities and CII entities, for cybersecurity of AI/ML systems
      or cybersecurity information. Binding unknown for this scenario: the scenario's operators
      are not designated CII entities, and the incident is an AI model fault, not a cyber
      attack. Printed scope (p.8 of the PDF): applies to Ministries & Federal Authorities and
      Non-Government CII Entities; Emirate Government Entities through an Emirate CIIP Program,
      or directly where there is none. Legal status: Council-approved national policy (as
      printed on its cover); legal force for this scenario not established. Not redistributed:
