  - id: uae.csc-isf.traffic-light-protocol
    title: "UAE cyber information sharing framework 2.2.3: the Traffic Light Protocol signals with whom information may be shared"
    text: >-
      Traffic Light Protocol (TLP) is a set of designations used to ensure that sensitive
      information is shared with the appropriate audience. The TLP uses a color-coded system to
      identify those with whom information may be shared, thus signaling originator’s intent and
      easing fears about the extent of disclosure. The TLP also speeds information exchange
      since recipients intrinsically know with whom they can share that information without
      having to refer to the originator for permission to share it.
    source_file: Cyber Security Information Sharing Framework V2.0.pdf
    page: 24
    article: "2.2.3 Methods of Information Exchange, Traffic Light Protocol"
    issuer: UAE Cyber Security Council
    jurisdiction: UAE (federal; federal entities and CII entities)
    document_date: "2023-05"
    status: draft
    binding: unknown
    notes: >-
