# Federal Decree-Law No. 45 of 2021 concerning the Protection of Personal Data (PDPL).
# Included mainly to show why it is NOT assumed to govern this scenario (CascadeGuard.md s.7).
clauses:
  - id: uae.pdpl.art2-2
    title: Exclusions from the PDPL, including health data with its own legislation
    text: >-
      2. Provisions of this Decree by Law shall not apply to the following: a. Government Data
      b. Governmental entities which control or process Personal Data. c. Personal Data held by
      the security and judicial authorities d. A Data Subject who processes his/her data for
      personal purposes. e. Personal Health Data that has legislation regulating its protection
      and processing.
    source_file: Federal Decree by Law No. (45) of 2021 Concerning the Protection of Personal Data.pdf
    page: 6
    article: Article (2)(2)(a)-(e)
    issuer: United Arab Emirates (federal)
    jurisdiction: UAE
    document_date: "2021"
    status: draft
    binding: true
    notes: >-
      Binding scope: federal law, applying to the processing described in Art 2(1), subject to the
      Art 2(2) exclusions. The PDF is an English version; the Arabic text was not checked. Working
      reading, pending human review: personal health data in the scenario is treated as regulated
      by Federal Law No. 2 of 2019 (uae.fl2-2019.art2), so the PDPL is treated as not governing
      it. If the portal operator were a governmental entity, exclusion (b) would also apply. The
      quote stops at (e); exclusions (f) and (g) follow, and (g) covers companies and
      establishments in free zones that have special data-protection legislation (PDF pages 6-7).
      The scenario's portal operator is not placed in a free zone.

  - id: uae.pdpl.art9-1
    title: Reporting a personal data breach to the Bureau
    text: >-
      1. In addition to the obligations of the Controller stipulated in this Decree by Law, the
      Controller shall, at the time it becomes aware of the existence of any breach or violation
      of Personal Data of the Data Subject that would prejudice the privacy, confidentiality and
      security of data, notify the Bureau of such breach or violation and the investigation
      rights within the period and in accordance with the measures and requirements set by the
      Executive Regulations of this Decree by Law,
    source_file: Federal Decree by Law No. (45) of 2021 Concerning the Protection of Personal Data.pdf
    page: 13
    article: Article (9)(1)
    issuer: United Arab Emirates (federal)
    jurisdiction: UAE
    document_date: "2021"
    status: draft
    binding: true
    notes: >-
      Binding on controllers within the PDPL's scope, subject to the exclusions in
      uae.pdpl.art2-2. The quote stops at a comma; the sentence continues "provided that the
      reporting is accompanied by the following data and documents:". Candidate
      mandate-overlap finding: the DHA policy (dha.pp11.4-18-4) appears to borrow this law's
      reporting period although uae.pdpl.art2-2 may exclude regulated health data. The period
      itself is set by the Executive Regulations, which are not in the corpus.

  - id: uae.pdpl.art18-1
    title: Right to object to decisions from automated processing
    text: >-
      1. The Data Subject shall have the right to object to any decisions resulting from
      automated processing, including profiling, particularly those decisions which have legal
      impact on or adversely affect the Data Subject.
    source_file: Federal Decree by Law No. (45) of 2021 Concerning the Protection of Personal Data.pdf
    page: 21
    article: Article (18)(1)
    issuer: United Arab Emirates (federal)
    jurisdiction: UAE
    document_date: "2021"
    status: draft
    binding: true
    notes: >-
      Binding scope: federal law, applying to the processing described in Art 2(1), subject to the
      Art 2(2) exclusions. The PDF is an English version; the Arabic text was not checked. A
      recourse right against automated decisions such as the account lockout. Its applicability
      here is uncertain because of the exclusions in uae.pdpl.art2-2. Qualified by Art 18(2) (PDF
      pages 21-22): the Data Subject "may not object" in listed cases (contract, automated
      processing required under other legislation, prior consent). Art 18(4) (PDF page 22) has the
      Controller "include the human element in reviewing automated processing decisions at the
      request of the Data Subject"; a candidate owner for lockout review if the PDPL applies.
