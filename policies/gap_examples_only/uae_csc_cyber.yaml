  - id: uae.csc-isf.cii-sectors-cross-sector-sharing
    title: "UAE cyber information sharing framework, CII sectors item 4: share sector regulator or sector incident response information with other sectors"
    text: >-
      Share information obtained by a sector regulator (e.g., strategic risks) and/or sector
      incident response center (e.g., incident-specific data) with other sectors to facilitate
      cross-sector cybersecurity information sharing.
    source_file: Cyber Security Information Sharing Framework V2.0.pdf
    page: 32
    article: "3.1 National Level Entities, Critical Information Infrastructure Sectors, item 4"
    issuer: UAE Cyber Security Council
    jurisdiction: UAE (federal; federal entities and CII entities)
    document_date: "2023-05"
    status: draft
    binding: unknown
    notes: >-
      UAE text (UAE Cyber Security Council). Viewer page 32 is printed page 31. Version as
      printed: May 2023, Version 1.0 (cover); the file name says "V2.0". A listed role of CII
      sectors (no modal verb printed; the item is a role statement, not "shall" or "should").
      Scope (as the human set it): applies to federal entities and CII entities, for
      cybersecurity of AI/ML systems or cybersecurity information. Binding unknown for this
