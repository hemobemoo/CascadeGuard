    query: establishment of the telecommunications regulatory authority and its purpose
    expect_source: ocr/887026278-TDRA-Telecom-Law-Final-English-o.ocr.pdf
    expect_page: 11
  - id: telecom-02
    topic: telecom duties
    query: Can the telecom regulator request information from licensees?
    expect_source: ocr/887026278-TDRA-Telecom-Law-Final-English-o.ocr.pdf
    expect_page: 14
    also_relevant:
      - {source: ocr/887026278-TDRA-Telecom-Law-Final-English-o.ocr.pdf, page: 25}
  - id: telecom-03
    topic: telecom duties
    query: licensees must take account of service quality and the special needs of users
    expect_source: ocr/887026278-TDRA-Telecom-Law-Final-English-o.ocr.pdf
    expect_page: 21
  # Incident response
  - id: incident-01
    topic: incident response
    query: incident response and business continuity plans for health information
    expect_source: Health Data Protection and Confidentiality Policy_EN2022810559.pdf
    expect_page: 30
    also_relevant:
      - {source: Health Data Protection and Confidentiality Policy_EN2022810559.pdf, page: 20}
  - id: incident-02
    topic: incident response
    query: investigate a health data breach from discovery until closure
    expect_source: Health Data Protection and Confidentiality Policy_EN2022810559.pdf
    expect_page: 31
  - id: incident-03
    topic: incident response
    query: deadline to notify the supervisory authority of a personal data breach in the EU
    expect_source: GDPR-Regulation (EU) 2016-679.pdf
    expect_page: 29
  - id: incident-04
    topic: incident response
