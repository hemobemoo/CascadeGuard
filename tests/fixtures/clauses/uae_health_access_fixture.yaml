# SYNTHETIC FIXTURE CLAUSES for engine tests (AGENTS.md "Human gates"). Not quotations, not law.
# Each stands in for the clause with the same id so the scripted decisions' citations resolve,
# and behaves in the engine as that clause would: same normalized reading and the same
# authority outcome (see each note). Regenerated from policies/reviewed/ on 2026-10-23 after
# the core-set review; tests/unit/test_fixtures.py fails if they drift.
# Exception: DHA fixtures keep binding: unknown on an illustrative clause so they mirror
# "authority uncertain"; policies/reviewed never allows that (human decision 7u).
clauses:
- id: dha.pp11.4-18-1
  title: SYNTHETIC FIXTURE mirroring dha.pp11.4-18-1
  text: 'Synthetic test fixture, not a quotation and not law: stands in for dha.pp11.4-18-1 so the engine
    can be tested while human review is pending.'
  issuer: CascadeGuard test fixture (synthetic)
  jurisdiction: synthetic
  document_date: unknown
  status: illustrative
  binding: unknown
  normalized:
    basis: interpreted
    mapping_note: The text obliges Entities to establish continuity and recovery plans; this is read
      as a duty that a fallback plan exists (maintain_fallback_plan), not as authority to activate a
      fallback channel (human decision h2, 2026-10-23). Entities is mapped to health_service_operator.
    kind: obligation
    actor: health_service_operator
    action: maintain_fallback_plan
    condition: standing obligation; no trigger stated in the text
  notes: 'Fixture only (tests/fixtures), never evidence that the real scenario works. Real clause dha.pp11.4-18-1
    (reviewed): binding unknown, kept as binding: unknown (the engine treats it as uncertain authority).'
